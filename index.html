<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--app-head-->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Crect x='9' y='9' width='14' height='14' fill='none' stroke='%237aa7ff' stroke-width='2.5' transform='rotate(20 16 16)'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Hide content until the intro decides what to do; failsafe reveal if scripts never run.
      document.documentElement.classList.add('js', 'booting');
      setTimeout(function () {
        document.documentElement.classList.remove('booting');
      }, 12000);
    </script>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <!--app-hub-->

    <div id="boot" aria-hidden="true">
      <div class="boot-title"><!--app-boot--></div>
      <button type="button" class="boot-skip" tabindex="-1">Skip ▸</button>
    </div>

    <header class="hud hud-top" aria-hidden="true">
      <span id="hud-date"></span>
      <span class="hud-time"><span id="hud-glyph"></span><span id="hud-time"></span></span>
    </header>

    <main id="content"><!--app-html--></main>

    <nav class="hud hud-bottom" aria-label="Quick actions">
      <a class="hint" href="#projects"><span class="glyph g-sq" aria-hidden="true">□</span>Projects</a>
      <a class="hint" href="#top"><span class="glyph g-ci" aria-hidden="true">○</span>Top</a>
      <button type="button" class="hint" id="opt-btn" aria-expanded="false" aria-controls="options">
        <span class="glyph g-tr" aria-hidden="true">△</span>Options
      </button>
    </nav>

    <div id="options" class="options panel" role="dialog" aria-label="Options" hidden>
      <p class="kicker">Options</p>
      <fieldset>
        <legend>Graphics quality</legend>
        <label><input type="radio" name="quality" value="auto" /> Auto</label>
        <label><input type="radio" name="quality" value="high" /> High</label>
        <label><input type="radio" name="quality" value="medium" /> Medium</label>
        <label><input type="radio" name="quality" value="low" /> Low</label>
      </fieldset>
      <fieldset>
        <legend>Video output</legend>
        <label><input type="radio" name="video" value="composite" /> Composite <small>(authentic)</small></label>
        <label><input type="radio" name="video" value="component" /> Component <small>(sharp)</small></label>
      </fieldset>
      <p class="options-status" id="opt-status"></p>
      <button type="button" class="opt-action" id="opt-replay"><span class="glyph g-x" aria-hidden="true">✕</span>Replay intro</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
